[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanosurrogate"
version = "0.1.0"
description = "Fast neural surrogate models for nanoscale transport and semiconductor devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [
  { name = "Jonas Mensing", email = "jonasmensing@posteo.de" },
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "tensorflow>=2.12.0",
    "pyarrow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
analysis = [
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]